name: LayaAir ACPCore runtime
on:
  push:
    branches: [codex/acp-mcp-feedback, codex/claude-model-catalog, codex/startup-recovery-index, codex/agent-test-diagnostics, codex/goal-status, codex/mcp-permission-identity, codex/fast-mode, codex/request-user-input, codex/agent-launch-arguments, codex/skill-path-containment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin-arm64
            target: aarch64-apple-darwin
            binary: aioncore
          - os: windows-latest
            platform: win32-x64
            target: x86_64-pc-windows-msvc
            binary: aioncore.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: 'none'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_STRIP: 'none'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}
      - name: Avoid Git link.exe shadowing MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
      - name: Verify startup recovery index migration and query plan
        run: cargo test -p aionui-db --test stale_runtime_index_migration --locked
      - run: cargo test -p aionui-ai-agent --lib custom_agent_probe --locked
      - run: cargo test -p aionui-ai-agent --lib probe_diagnostics --locked
      - run: cargo test -p aionui-session --lib native_goal --locked
      - run: cargo test -p aionui-session --lib goal_extensions --locked
      - run: cargo test -p aionui-ai-agent --lib goal_wire --locked
      - run: cargo test -p aionui-conversation --lib goal_ --locked
      - run: cargo test -p aionui-conversation --test conversation_extended goal_metadata --locked
      - run: cargo test -p aionui-session --lib service_tier --locked
      - run: cargo test -p aionui-session --lib claude_remembered_approval --locked
      - run: cargo test -p aionui-ai-agent --lib claude_remembered_approval --locked
      - run: cargo test -p aionui-session --lib command_always_allow --locked
      - run: cargo test -p aionui-session --lib command_approval_policy --locked
      - run: cargo test -p aionui-session --lib codex_questions --locked
      - run: cargo test -p aionui-session --lib spawner --locked
      - run: cargo test -p aionui-ai-agent --lib service_tier --locked
      - run: cargo test -p aionui-session --lib mcp_tool_approval_identity --locked
      - run: cargo test -p aionui-ai-agent --lib get_confirmations_recovers_mcp_identity --locked
      - run: cargo test -p aionui-skill-runtime --test runtime_skills_e2e existing_channel_conversations_only_read_custom_skills_in_the_current_project --locked
      - run: cargo test -p aionui-extension --lib rebuild_replaces_old_project_links_for_the_same_skill_name --locked
      - run: cargo test -p aionui-ai-agent --lib claude_catalog_refresh --locked
      - run: cargo test -p aionui-app --test agent_catalog_refresh_e2e --locked
      - name: Build release runtime
        env:
          CARGO_PROFILE_RELEASE_STRIP: 'none'
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }} -p aionui-app --locked
      - name: Build matching Intel macOS executable for cloud smoke tests
        if: runner.os == 'macOS'
        env:
          CARGO_PROFILE_RELEASE_STRIP: 'none'
        run: cargo build --release --target x86_64-apple-darwin -p aionui-app --locked
      - name: Verify Windows runtime imports and version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/check-windows-runtime-imports.py target/${{ matrix.target }}/release/${{ matrix.binary }}
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version
      - name: Verify packaged Agent MCP negotiation and wait feedback
        if: runner.os == 'macOS'
        run: python3 scripts/smoke-acp-mcp-feedback.py target/x86_64-apple-darwin/release/aioncore --report release-artifact/ACP_MCP_FEEDBACK_PROVENANCE.json
      - name: Verify pinned Pi adapter with native stdio and HTTP MCP
        run: node scripts/smoke-pi-mcp.cjs ${{ runner.os == 'macOS' && 'target/x86_64-apple-darwin/release/aioncore' || 'target/x86_64-pc-windows-msvc/release/aioncore.exe' }} release-artifact/PI_MCP_PROVENANCE.json
      - name: Verify macOS runtime linkage
        if: runner.os == 'macOS'
        run: |
          file target/${{ matrix.target }}/release/${{ matrix.binary }}
          otool -L target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Verify architecture and write build provenance
        run: python scripts/write-runtime-provenance.py --platform ${{ matrix.platform }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --output release-artifact ${{ runner.os == 'macOS' && '--version-binary target/x86_64-apple-darwin/release/aioncore' || '' }}
      - name: Verify existing Lark and Weixin conversations with the packaged executable
        run: node scripts/smoke-acpcore-channel-skill-paths.cjs ${{ runner.os == 'macOS' && 'target/x86_64-apple-darwin/release/aioncore' || 'release-artifact/aioncore.exe' }}
      - name: Verify packaged Claude model discovery and cleanup
        run: node scripts/smoke-claude-model-catalog.cjs ${{ runner.os == 'macOS' && 'target/x86_64-apple-darwin/release/aioncore' || 'release-artifact/aioncore.exe' }}
      - name: Verify packaged runtime startup index upgrade and repeated startup
        run: python scripts/smoke-startup-recovery-index.py ${{ runner.os == 'macOS' && 'target/x86_64-apple-darwin/release/aioncore' || 'release-artifact/aioncore.exe' }}
      - uses: actions/upload-artifact@v4
        with:
          name: acp-core-${{ matrix.platform }}-${{ github.sha }}
          path: release-artifact/
          retention-days: 14
          if-no-files-found: error
