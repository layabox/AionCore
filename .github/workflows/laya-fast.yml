name: LayaAir ACPCore runtime
on:
  push:
    branches: [codex/conversation-user-activity, codex/acp-mcp-feedback, codex/claude-model-catalog, codex/startup-recovery-index, codex/agent-test-diagnostics, codex/goal-status, codex/mcp-permission-identity, codex/fast-mode, codex/request-user-input, codex/agent-launch-arguments, codex/skill-path-containment]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: laya-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: laya-focused-linux
          cache-workspace-crates: true
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: bash scripts/migration/check-immutability.test.sh
      - run: bash scripts/migration/check-immutability.sh
      - name: Check modified Agent and conversation paths
        run: cargo clippy -p aionui-ai-agent -p aionui-conversation --all-targets --locked -- -D warnings
      - name: Verify ACP feedback and protocol regression coverage
        run: cargo test -p aionui-ai-agent --lib manager::acp --locked
      - name: Verify conversation recency migration and writes
        run: cargo test -p aionui-db --test conversation_user_activity --locked
      - name: Verify conversation recency response and list
        run: cargo test -p aionui-conversation --lib recency --locked
      - name: Verify Pi failure classification and notification
        run: node scripts/test-pi-request-feedback.mjs
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
            binary: aioncore
          - os: windows-latest
            platform: win32-x64
            target: x86_64-pc-windows-msvc
            binary: aioncore.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: 'none'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_STRIP: 'none'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Avoid Git link.exe shadowing MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
      - name: Build release runtime
        env:
          CARGO_PROFILE_RELEASE_STRIP: 'none'
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }} -p aionui-app --locked
      - name: Verify Windows runtime imports and version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/check-windows-runtime-imports.py target/${{ matrix.target }}/release/${{ matrix.binary }}
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version
      - name: Verify packaged Agent MCP negotiation and wait feedback
        if: runner.os == 'macOS'
        run: python3 scripts/smoke-acp-mcp-feedback.py target/aarch64-apple-darwin/release/aioncore --report release-artifact/ACP_MCP_FEEDBACK_PROVENANCE.json
      - name: Verify pinned Pi adapter with native stdio and HTTP MCP
        run: node scripts/smoke-pi-mcp.cjs ${{ runner.os == 'macOS' && 'target/aarch64-apple-darwin/release/aioncore' || 'target/x86_64-pc-windows-msvc/release/aioncore.exe' }} release-artifact/PI_MCP_PROVENANCE.json
      - name: Verify macOS runtime linkage
        if: runner.os == 'macOS'
        run: |
          file target/${{ matrix.target }}/release/${{ matrix.binary }}
          otool -L target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Verify architecture and write build provenance
        run: python scripts/write-runtime-provenance.py --platform ${{ matrix.platform }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --output release-artifact
      - name: Verify existing Lark and Weixin conversations with the packaged executable
        run: node scripts/smoke-acpcore-channel-skill-paths.cjs ${{ runner.os == 'macOS' && 'target/aarch64-apple-darwin/release/aioncore' || 'release-artifact/aioncore.exe' }}
      - name: Verify packaged Claude model discovery and cleanup
        run: node scripts/smoke-claude-model-catalog.cjs ${{ runner.os == 'macOS' && 'target/aarch64-apple-darwin/release/aioncore' || 'release-artifact/aioncore.exe' }}
      - name: Verify packaged runtime startup index upgrade and repeated startup
        run: python scripts/smoke-startup-recovery-index.py ${{ runner.os == 'macOS' && 'target/aarch64-apple-darwin/release/aioncore' || 'release-artifact/aioncore.exe' }}
      - uses: actions/upload-artifact@v4
        with:
          name: acp-core-${{ matrix.platform }}-${{ github.sha }}
          path: release-artifact/
          retention-days: 14
          if-no-files-found: error
