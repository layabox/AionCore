name: LayaAir Fast runtime
on:
  push:
    branches: [codex/fast-mode]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            binary: aioncore
          - os: windows-latest
            platform: win32-x64
            binary: aioncore.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Avoid Git link.exe shadowing MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
      - run: cargo test -p aionui-session --lib service_tier --locked
      - run: cargo test -p aionui-ai-agent --lib service_tier --locked
      - name: Build release runtime
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo build --release --target x86_64-pc-windows-msvc -p aionui-app --locked
            cp target/x86_64-pc-windows-msvc/release/aioncore.exe target/release/aioncore.exe
          else
            cargo build --release -p aionui-app --locked
          fi
      - name: Verify Windows runtime has no VC redistributable dependency
        if: runner.os == 'Windows'
        run: python scripts/check-windows-runtime-imports.py target/release/aioncore.exe
      - run: ./target/release/${{ matrix.binary }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: acp-core-${{ matrix.platform }}-${{ github.sha }}
          path: target/release/${{ matrix.binary }}
          retention-days: 14
